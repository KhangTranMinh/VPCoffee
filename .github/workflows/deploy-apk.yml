# ============================================================================
# GITHUB PAGES DEPLOYMENT WORKFLOW
# ============================================================================
#
# This workflow deploys APKs to GitHub Pages when code is pushed to main.
# It matches the Fastlane logic for GitHub Pages deployment.
#
# Fastlane handles:
#   - Version increment
#   - APK build
#   - Firebase App Distribution deployment
#   - Git commit and push
#
# This workflow handles:
#   - GitHub Pages deployment (runs after Fastlane pushes)
#
# To deploy manually: use workflow_dispatch (GitHub Actions UI)
# ============================================================================

name: Deploy APK to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - app/build.gradle.kts
      - pushtest/build.gradle.kts
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip apk deploy]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Get current versions
        id: versions
        run: |
          vp_name=$(sed -n 's/^[[:space:]]*versionName = "\([0-9.][0-9.]*\)".*/\1/p' app/build.gradle.kts)
          vp_code=$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts)
          pt_name=$(sed -n 's/^[[:space:]]*versionName = "\([0-9.][0-9.]*\)".*/\1/p' pushtest/build.gradle.kts)
          pt_code=$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' pushtest/build.gradle.kts)
          echo "VP_VERSION=${vp_name} (${vp_code})" >> "$GITHUB_ENV"
          echo "PT_VERSION=${pt_name} (${pt_code})" >> "$GITHUB_ENV"

      - name: Build debug APKs
        run: |
          ./gradlew :app:assembleDebug
          ./gradlew :pushtest:assembleDebug

      - name: Prepare GitHub Pages site
        run: |
          mkdir -p site
          cp app/build/outputs/apk/debug/app-debug.apk "site/VPCoffee.apk"
          cp pushtest/build/outputs/apk/debug/pushtest-debug.apk "site/VPCoffeePushTest.apk"
          sed \
            -e "s|__VP_VERSION__|${VP_VERSION}|g" \
            -e "s|__PT_VERSION__|${PT_VERSION}|g" \
            template_index.html > site/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip apk deploy]')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
