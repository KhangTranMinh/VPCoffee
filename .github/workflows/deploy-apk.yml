# ============================================================================
# DISABLED WORKFLOW - DO NOT RUN AUTOMATICALLY
# ============================================================================
#
# This workflow is DISABLED because we now use Fastlane for deployments.
#
# Fastlane handles:
#   - Version increment
#   - APK build
#   - Firebase App Distribution deployment
#   - GitHub Pages update
#   - Git commit and push
#
# To deploy, use Fastlane instead:
#   bundle exec fastlane deploy_vpcoffee
#   bundle exec fastlane deploy_pushtest
#   bundle exec fastlane deploy_all
#
# This workflow is kept for reference only. It will NOT run on push.
# To run manually: use workflow_dispatch (GitHub Actions UI)
# ============================================================================

name: "[DISABLED] Publish APK to GitHub Pages"

# DISABLED: Only allow manual trigger via workflow_dispatch
# Removed automatic push trigger - use Fastlane instead
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Increase app version
        run: |
          task_code=$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts)
          task_name=$(sed -n 's/^[[:space:]]*versionName = "\([0-9.][0-9.]*\)".*/\1/p' app/build.gradle.kts)
          IFS=. read -r task_major task_minor task_patch <<< "$task_name"
          task_patch=${task_patch:-0}
          task_next_code=$((task_code + 1))
          task_next_name="${task_major}.${task_minor}.$((task_patch + 1))"
          sed -i "s/versionCode = ${task_code}/versionCode = ${task_next_code}/" app/build.gradle.kts
          sed -i "s/versionName = \"${task_name}\"/versionName = \"${task_next_name}\"/" app/build.gradle.kts
          echo "APK_FILE=VPCoffee-v${task_next_name}.apk" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${task_next_name}" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Prepare GitHub Pages site
        run: |
          mkdir -p site
          cp app/build/outputs/apk/debug/app-debug.apk "site/${APK_FILE}"
          sed \
            -e "s/__APK_FILE__/${APK_FILE}/g" \
            -e "s/__VERSION__/${VERSION_NAME}/g" \
            index.html > site/index.html

      - name: Commit version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "chore: release v${VERSION_NAME} [skip apk deploy]"
          git push origin HEAD:main

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
